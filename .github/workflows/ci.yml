name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 3 * * 0'

jobs:
  test:
    name: ${{ matrix.os == 'ubuntu-latest' && format('test ({0})', matrix.python-version) || format('test ({0}, {1})', matrix.os, matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install ruff mypy

    - name: Run Ruff Lint Checks
      run: |
        ruff check parallax scripts tests demo

    - name: Run Mypy Type Checks
      run: |
        mypy parallax

    - name: Run Test Suite with Pytest
      run: |
        pytest tests/ -v

  mutation-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Mutation Testing on Core Modules
      run: |
        python scripts/mutation_test.py

  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Cargo Tests
      run: |
        cargo clippy --manifest-path crates/parallax-rs/Cargo.toml --all-targets -- -D warnings
        cd crates/parallax-rs
        cargo test

    - name: Build Rust Engine Release
      run: |
        cd crates/parallax-rs
        cargo build --release

    - name: Run Rust Bridge Tests
      run: |
        pytest tests/test_rust_bridge.py -v
