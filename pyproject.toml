[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.1.0"
description = "First-principles zero-dependency Autograd and Transformer framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Göksel Özgür", email = "gokselozgur5@gmail.com" },
]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
parallax-eval = "scripts.eval_model:main"
parallax-quantize = "scripts.quantize_model:main"
parallax-infer = "scripts.run_inference:main"
parallax-serve = "scripts.serve_openai:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parallax*", "scripts*"]

[tool.setuptools.package-data]
parallax = ["csrc/Makefile", "csrc/*.c", "csrc/*.h"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B007", "B023", "B905", "F541", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "parallax.yarn",
    "parallax.xlora",
    "parallax.tree_drafting_v2",
    "parallax.tree_drafting",
    "parallax.top_a",
    "parallax.streaming",
    "parallax.soft_capping",
    "parallax.sliding_recompute",
    "parallax.simpo",
    "parallax.self_speculative",
    "parallax.ring_attention",
    "parallax.qgalore",
    "parallax.prompt_lookup",
    "parallax.ppo",
    "parallax.paged_flash_decoding",
    "parallax.paged_attention",
    "parallax.orpo",
    "parallax.ntk_rope",
    "parallax.muon",
    "parallax.multistream",
    "parallax.mod",
    "parallax.min_p",
    "parallax.metal_engine",
    "parallax.kv_cache_pruner",
    "parallax.grouped_gemm",
    "parallax.c_engine",
    "parallax.gguf",
    "parallax.models.qwen2",
    "parallax.models.llama",
    "parallax.models.bit_transformer",
    "parallax.models.gpt",
    "parallax.trainer",
    "parallax.gguf_exporter",
    "parallax.hf_loader",
    "parallax.tensor",
    "parallax.lora",
    "parallax.bitnet",
    "parallax.attention",
    "parallax.bit_attention",
    "parallax.rl",
    "parallax.quant",
    "parallax.prune",
    "parallax.checkpoint",
    "parallax.gguf_tokenizer",
    "parallax.gguf_loader",
]
ignore_errors = true


