[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.2.0"
description = "First-principles Autograd and Transformer framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Göksel Özgür", email = "gokselozgur5@gmail.com" },
]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[project.scripts]
parallax-eval = "parallax.cli.eval_model:main"
parallax-quantize = "parallax.cli.quantize_model:main"
parallax-infer = "parallax.cli.run_inference:main"
parallax-serve = "parallax.cli.serve_openai:main"
parallax-demo = "parallax.cli.demo_showcase:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parallax*"]

[tool.setuptools.package-data]
parallax = ["csrc/Makefile", "csrc/*.c", "csrc/*.h", "webui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B007", "B023", "B905", "F541"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "parallax.metal_engine",
    "parallax.quant",
    "parallax.checkpoint",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "parallax.tensor"
disable_error_code = ["assignment", "no-redef", "operator", "call-overload"]
