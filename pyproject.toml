[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "0.1.0"
description = "First-principles zero-dependency Autograd and Transformer framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Göksel Özgür", email = "gokselozgur5@gmail.com" },
]
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
parallax-eval = "scripts.eval_model:main"
parallax-quantize = "scripts.quantize_model:main"
parallax-infer = "scripts.run_inference:main"
parallax-serve = "scripts.serve_openai:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parallax*", "scripts*"]

[tool.setuptools.package-data]
parallax = ["csrc/Makefile", "csrc/*.c", "csrc/*.h", "webui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B007", "B023", "B905", "F541"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "parallax.paged_attention",
    "parallax.metal_engine",
    "parallax.models.qwen2",
    "parallax.models.llama",
    "parallax.models.bit_transformer",
    "parallax.hf_loader",
    "parallax.quant",
    "parallax.prune",
    "parallax.checkpoint",
    "parallax.gguf_loader",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "parallax.tensor"
disable_error_code = ["assignment", "no-redef", "operator", "call-overload"]
